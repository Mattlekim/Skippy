name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Build Desktop (PC)
        run: dotnet build src/Skippy.Desktop -c Release

      - name: Publish Web (browser preview)
        # Compile-checks the browser build. The deployable output is produced by
        # the deploy-web-preview job below (which uploads it to Pages), so we do
        # not upload a separate artifact here — that only burns Actions storage.
        run: dotnet publish src/Skippy.Web -c Release -o web-dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Build Android APK
        # global.json rolls forward to the latest major SDK (currently .NET 10),
        # under which the net8.0-android workload is flagged out-of-support and
        # errors the build (NETSDK1202) during restore. It still builds fine, so
        # opt out of both the EOL-workload and EOL-framework checks.
        run: dotnet build src/Skippy.Android -c Release -f net8.0-android -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false

  # Optional: publish the browser preview to GitHub Pages on pushes to main.
  # Enable Pages in the repo settings (Source: GitHub Actions) to use this.
  deploy-web-preview:
    if: github.ref == 'refs/heads/main'
    needs: desktop-and-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Publish Web
        run: dotnet publish src/Skippy.Web -c Release -o web-dist

      # Blazor on a project Pages site lives under /<repo>/, so rewrite <base>.
      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' web-dist/wwwroot/index.html
          touch web-dist/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
