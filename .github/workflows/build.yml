name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Build Desktop (PC)
        run: dotnet build src/Skippy.Desktop -c Release

      - name: Publish Web (browser preview)
        # Compile-checks the browser build. The deployable output is produced by
        # the deploy-web-preview job below (which uploads it to Pages), so we do
        # not upload a separate artifact here — that only burns Actions storage.
        run: dotnet publish src/Skippy.Web -c Release -o web-dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The repo global.json rolls forward to the latest major SDK (.NET 10),
      # under which net8.0-android is rejected as an out-of-support workload
      # (NETSDK1202). Pin this job to the .NET 8 SDK just for CI — this only
      # rewrites the checked-out copy, never the committed global.json.
      - name: Pin .NET 8 SDK for the Android build
        run: |
          echo '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Build Android APK
        run: dotnet build src/Skippy.Android -c Release -f net8.0-android

  # Publish the browser build to the gh-pages branch on pushes to main.
  # This deploys by pushing a branch (not an Actions artifact), so it uses no
  # Actions storage. In the repo: Settings → Pages → Source: "Deploy from a
  # branch" → gh-pages / (root). Site: https://<owner>.github.io/<repo>/
  deploy-web-preview:
    if: github.ref == 'refs/heads/main'
    needs: desktop-and-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Publish Web
        run: dotnet publish src/Skippy.Web -c Release -o web-dist

      # Blazor on a project Pages site lives under /<repo>/, so rewrite <base>;
      # .nojekyll keeps GitHub Pages from hiding the _framework folder.
      - name: Prepare site
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' web-dist/wwwroot/index.html
          touch web-dist/wwwroot/.nojekyll

      - name: Deploy to gh-pages
        run: |
          cd web-dist/wwwroot
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
