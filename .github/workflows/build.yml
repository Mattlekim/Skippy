name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Build Desktop (PC)
        run: dotnet build src/Skippy.Desktop -c Release

      - name: Publish Web (browser preview)
        run: dotnet publish src/Skippy.Web -c Release -o web-dist

      - name: Upload Web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: skippy-web
          path: web-dist/wwwroot

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Build Android APK
        run: dotnet build src/Skippy.Android -c Release -f net8.0-android

  # Optional: publish the browser preview to GitHub Pages on pushes to main.
  # Enable Pages in the repo settings (Source: GitHub Actions) to use this.
  deploy-web-preview:
    if: github.ref == 'refs/heads/main'
    needs: desktop-and-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools (MGCB)
        run: dotnet tool restore

      - name: Publish Web
        run: dotnet publish src/Skippy.Web -c Release -o web-dist

      # Blazor on a project Pages site lives under /<repo>/, so rewrite <base>.
      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' web-dist/wwwroot/index.html
          touch web-dist/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
